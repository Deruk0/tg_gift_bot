            <script>function neighbourhoodHighlight(params) {
  // console.log("in nieghbourhoodhighlight");
  allNodes = nodes.get({ returnType: "Object" });
  // originalNodes = JSON.parse(JSON.stringify(allNodes));
  // if something is selected:
  if (params.nodes.length > 0) {
    highlightActive = true;
    var i, j;
    var selectedNode = params.nodes[0];
    var degrees = 2;

    // mark all nodes as hard to read.
    for (let nodeId in allNodes) {
      // nodeColors[nodeId] = allNodes[nodeId].color;
      allNodes[nodeId].color = "rgba(200,200,200,0.5)";
      if (allNodes[nodeId].hiddenLabel === undefined) {
        allNodes[nodeId].hiddenLabel = allNodes[nodeId].label;
        allNodes[nodeId].label = undefined;
      }
    }
    var connectedNodes = network.getConnectedNodes(selectedNode);
    var allConnectedNodes = [];

    // get the second degree nodes
    for (i = 1; i < degrees; i++) {
      for (j = 0; j < connectedNodes.length; j++) {
        allConnectedNodes = allConnectedNodes.concat(
          network.getConnectedNodes(connectedNodes[j])
        );
      }
    }

    // all second degree nodes get a different color and their label back
    for (i = 0; i < allConnectedNodes.length; i++) {
      // allNodes[allConnectedNodes[i]].color = "pink";
      allNodes[allConnectedNodes[i]].color = "rgba(150,150,150,0.75)";
      if (allNodes[allConnectedNodes[i]].hiddenLabel !== undefined) {
        allNodes[allConnectedNodes[i]].label =
          allNodes[allConnectedNodes[i]].hiddenLabel;
        allNodes[allConnectedNodes[i]].hiddenLabel = undefined;
      }
    }

    // all first degree nodes get their own color and their label back
    for (i = 0; i < connectedNodes.length; i++) {
      // allNodes[connectedNodes[i]].color = undefined;
      allNodes[connectedNodes[i]].color = nodeColors[connectedNodes[i]];
      if (allNodes[connectedNodes[i]].hiddenLabel !== undefined) {
        allNodes[connectedNodes[i]].label =
          allNodes[connectedNodes[i]].hiddenLabel;
        allNodes[connectedNodes[i]].hiddenLabel = undefined;
      }
    }

    // the main node gets its own color and its label back.
    // allNodes[selectedNode].color = undefined;
    allNodes[selectedNode].color = nodeColors[selectedNode];
    if (allNodes[selectedNode].hiddenLabel !== undefined) {
      allNodes[selectedNode].label = allNodes[selectedNode].hiddenLabel;
      allNodes[selectedNode].hiddenLabel = undefined;
    }
  } else if (highlightActive === true) {
    // console.log("highlightActive was true");
    // reset all nodes
    for (let nodeId in allNodes) {
      // allNodes[nodeId].color = "purple";
      allNodes[nodeId].color = nodeColors[nodeId];
      // delete allNodes[nodeId].color;
      if (allNodes[nodeId].hiddenLabel !== undefined) {
        allNodes[nodeId].label = allNodes[nodeId].hiddenLabel;
        allNodes[nodeId].hiddenLabel = undefined;
      }
    }
    highlightActive = false;
  }

  // transform the object into an array
  var updateArray = [];
  if (params.nodes.length > 0) {
    for (let nodeId in allNodes) {
      if (allNodes.hasOwnProperty(nodeId)) {
        // console.log(allNodes[nodeId]);
        updateArray.push(allNodes[nodeId]);
      }
    }
    nodes.update(updateArray);
  } else {
    // console.log("Nothing was selected");
    for (let nodeId in allNodes) {
      if (allNodes.hasOwnProperty(nodeId)) {
        // console.log(allNodes[nodeId]);
        // allNodes[nodeId].color = {};
        updateArray.push(allNodes[nodeId]);
      }
    }
    nodes.update(updateArray);
  }
}

function filterHighlight(params) {
  allNodes = nodes.get({ returnType: "Object" });
  // if something is selected:
  if (params.nodes.length > 0) {
    filterActive = true;
    let selectedNodes = params.nodes;

    // hiding all nodes and saving the label
    for (let nodeId in allNodes) {
      allNodes[nodeId].hidden = true;
      if (allNodes[nodeId].savedLabel === undefined) {
        allNodes[nodeId].savedLabel = allNodes[nodeId].label;
        allNodes[nodeId].label = undefined;
      }
    }

    for (let i=0; i < selectedNodes.length; i++) {
      allNodes[selectedNodes[i]].hidden = false;
      if (allNodes[selectedNodes[i]].savedLabel !== undefined) {
        allNodes[selectedNodes[i]].label = allNodes[selectedNodes[i]].savedLabel;
        allNodes[selectedNodes[i]].savedLabel = undefined;
      }
    }

  } else if (filterActive === true) {
    // reset all nodes
    for (let nodeId in allNodes) {
      allNodes[nodeId].hidden = false;
      if (allNodes[nodeId].savedLabel !== undefined) {
        allNodes[nodeId].label = allNodes[nodeId].savedLabel;
        allNodes[nodeId].savedLabel = undefined;
      }
    }
    filterActive = false;
  }

  // transform the object into an array
  var updateArray = [];
  if (params.nodes.length > 0) {
    for (let nodeId in allNodes) {
      if (allNodes.hasOwnProperty(nodeId)) {
        updateArray.push(allNodes[nodeId]);
      }
    }
    nodes.update(updateArray);
  } else {
    for (let nodeId in allNodes) {
      if (allNodes.hasOwnProperty(nodeId)) {
        updateArray.push(allNodes[nodeId]);
      }
    }
    nodes.update(updateArray);
  }
}

function selectNode(nodes) {
  network.selectNodes(nodes);
  neighbourhoodHighlight({ nodes: nodes });
  return nodes;
}

function selectNodes(nodes) {
  network.selectNodes(nodes);
  filterHighlight({nodes: nodes});
  return nodes;
}

function highlightFilter(filter) {
  let selectedNodes = []
  let selectedProp = filter['property']
  if (filter['item'] === 'node') {
    let allNodes = nodes.get({ returnType: "Object" });
    for (let nodeId in allNodes) {
      if (allNodes[nodeId][selectedProp] && filter['value'].includes((allNodes[nodeId][selectedProp]).toString())) {
        selectedNodes.push(nodeId)
      }
    }
  }
  else if (filter['item'] === 'edge'){
    let allEdges = edges.get({returnType: 'object'});
    // check if the selected property exists for selected edge and select the nodes connected to the edge
    for (let edge in allEdges) {
      if (allEdges[edge][selectedProp] && filter['value'].includes((allEdges[edge][selectedProp]).toString())) {
        selectedNodes.push(allEdges[edge]['from'])
        selectedNodes.push(allEdges[edge]['to'])
      }
    }
  }
  selectNodes(selectedNodes)
}</script>

  <div id="giftgraph-ui">
    <div id="giftgraph-card">

        <span class="giftgraph-pill"><span class="giftgraph-dot" data-kind="regular" style="background:#7c3aed"></span>Обычный узел</span>
        <span class="giftgraph-pill"><span class="giftgraph-dot" data-kind="path" style="background:#9ca3af"></span>Путь</span>

      </div>

    </div>

</div>

<script>
(function() {
  const META = JSON.parse(document.getElementById('giftgraph-shell').dataset.meta);
  const PALETTE = JSON.parse(document.getElementById('giftgraph-shell').dataset.palette);
  const shell = document.getElementById('giftgraph-shell');
  const bg = document.getElementById('giftgraph-bg');
  const container = document.getElementById('mynetwork');
  const toggle = document.getElementById('giftgraph-theme-toggle');
  const subtitle = document.getElementById('giftgraph-subtitle');
  const legendDots = Array.from(document.querySelectorAll('.giftgraph-dot'));

  let hoverSaved = {};

  function clearHoverState() {
    hoverSaved = {};
  }

  function debounce(fn, ms) {
    let timer;
    return function(...args) {
      clearTimeout(timer);
      timer = setTimeout(() => fn.apply(this, args), ms);
    };
  }

  function systemTheme() {
    try {
      return window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
    } catch (e) {
      return 'dark';
    }
  }

  function currentTheme() {
    try {
      return localStorage.getItem('giftgraph-theme') || systemTheme();
    } catch (e) {
      return systemTheme();
    }
  }

  function saveTheme(theme) {
    try { localStorage.setItem('giftgraph-theme', theme); } catch (e) {}
  }

  function getNetwork() {
    try {
      return typeof network !== 'undefined' ? network : (window.network || null);
    } catch (e) {
      return window.network || null;
    }
  }

  function nodeStyle(kind, palette) {
    if (kind === 'start') {
      return { color: { background: palette.start_node, border: '#cbd5e1' }, size: 44, font: { color: palette.text, size: 17, bold: true } };
    }
    if (kind === 'path') {
      return { color: { background: palette.path_node, border: '#9ca3af' }, size: 24, font: { color: palette.text, size: 13, bold: false } };
    }
    if (kind === 'anonymous') {
      return { color: { background: palette.anonymous, border: '#f97316' }, size: 12, font: { color: palette.muted, size: 9, bold: false } };
    }
    return { color: { background: palette.regular, border: '#6d28d9' }, size: 20, font: { color: palette.text, size: 12, bold: false } };
  }

  function edgeStyle(edge, palette) {
    const color = edge.on_path ? palette.edge_path : palette.edge;
    return {
      color,
      width: edge.width,
      label: '',
      title: edge.title,
      arrows: edge.mutual ? { to: { enabled: true, scaleFactor: 0.45 }, from: { enabled: true, scaleFactor: 0.45 } } : { to: { enabled: true, scaleFactor: 0.45 }, from: { enabled: false } },
    };
  }

  function bindToggle() {
    if (!toggle) return;
    toggle.addEventListener('click', () => {
      const next = currentTheme() === 'light' ? 'dark' : 'light';
      saveTheme(next);
      applyTheme(next);
    });
  }

  function initParallax() {
    const canvas = document.querySelector('#mynetwork canvas');
    if (!canvas) return;

    let raf = 0;
    let lastX = 0.5;
    let lastY = 0.5;

    const paint = () => {
      raf = 0;
      const dx = (lastX - 0.5) * 10;
      const dy = (lastY - 0.5) * 10;
      canvas.style.transform = `translate3d(${dx}px, ${dy}px, 0)`;
      if (bg) {
        bg.style.backgroundPosition = `${50 + dx * 0.15}% ${50 + dy * 0.15}%`;
      }
    };

    const onMove = (ev) => {
      const rect = canvas.getBoundingClientRect();
      if (!rect.width || !rect.height) return;
      lastX = (ev.clientX - rect.left) / rect.width;
      lastY = (ev.clientY - rect.top) / rect.height;
      if (!raf) raf = requestAnimationFrame(paint);
    };

    const reset = () => {
      canvas.style.transform = 'translate3d(0, 0, 0)';
      if (bg) bg.style.backgroundPosition = '50% 50%';
    };

    canvas.addEventListener('pointermove', onMove, { passive: true });
    canvas.addEventListener('pointerleave', reset, { passive: true });
  }

  function applyTheme(themeName) {
    clearHoverState();
    const palette = themeName === 'light' ? PALETTE.light : PALETTE.dark;
    const net = getNetwork();
    document.documentElement.setAttribute('data-theme', themeName);
    if (shell) shell.setAttribute('data-theme', themeName);
    if (document.body) {
      document.body.style.background = palette.page;
      document.body.style.backgroundColor = palette.page;
      document.body.style.backgroundImage = `radial-gradient(circle at 20% 20%, ${palette.page_glow}, transparent 36%), radial-gradient(circle at 80% 80%, rgba(59, 130, 246, 0.10), transparent 30%), linear-gradient(180deg, ${palette.page}, ${palette.page})`;
      document.body.style.color = palette.text;
    }
    if (bg) {
      bg.style.backgroundColor = palette.page;
      bg.style.backgroundImage = `radial-gradient(circle at 20% 20%, ${palette.page_glow}, transparent 36%), radial-gradient(circle at 80% 80%, rgba(59, 130, 246, 0.10), transparent 30%), linear-gradient(180deg, ${palette.page}, ${palette.page})`;
    }
    if (container) container.style.background = 'transparent';
    if (toggle) toggle.textContent = themeName === 'light' ? '🌙 Тёмная' : '☀️ Светлая';
    if (subtitle) subtitle.style.color = palette.muted;
    legendDots.forEach((dot) => {
      const key = dot.getAttribute('data-kind');
      if (key === 'start') dot.style.background = palette.start_node;
      if (key === 'regular') dot.style.background = palette.regular;
      if (key === 'path') dot.style.background = palette.path_node;
      if (key === 'anonymous') dot.style.background = palette.anonymous;
    });

    if (net && net.body && net.body.data) {
      const nodeUpdates = Object.entries(META.nodes).map(([id, info]) => {
        const st = nodeStyle(info.kind, palette);
        const degree = info.degree || 0;
        let size = st.size;
        if (info.kind === 'start') size = 44;
        else if (info.kind === 'path') size = 26 + Math.min(degree, 14) * 1.2;
        else if (info.kind === 'anonymous') size = 14 + Math.min(degree, 8) * 0.5;
        else size = 20 + Math.min(degree, 18) * 1.0;
        return { id, color: st.color, size: Math.round(size * 10) / 10, font: st.font, title: info.title };
      });
      const edgeUpdates = META.edges.map((edge) => {
        const st = edgeStyle(edge, palette);
        return { id: edge.id, color: st.color, width: st.width, label: st.label, title: st.title, arrows: st.arrows };
      });
      net.body.data.nodes.update(nodeUpdates);
      net.body.data.edges.update(edgeUpdates);
      try { net.fit(); } catch (e) {}
    }
  }

  // ── Settings panel ─────────────────────────────────────────────────────

  function buildSettingsPanel() {
    if (!shell) return;
    const existing = document.getElementById('giftgraph-settings-panel');
    if (existing) return;

    const panel = document.createElement('div');
    panel.id = 'giftgraph-settings-panel';
    panel.style.cssText = 'position:absolute;right:18px;bottom:18px;z-index:40;pointer-events:auto;display:flex;flex-direction:column;gap:8px;align-items:flex-end;';

    panel.innerHTML = `
      <div id="giftgraph-settings-box" style="background:var(--giftgraph-panel);border:1px solid var(--giftgraph-border);border-radius:14px;padding:12px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);width:220px;display:none;">
        <div style="font-size:13px;font-weight:700;color:var(--giftgraph-text);margin-bottom:10px;">⚙ Настройки</div>
        <div style="display:flex;flex-direction:column;gap:10px;">
          <label style="font-size:11px;color:var(--giftgraph-muted);">
            Размер узлов <span id="val-node-scale" style="float:right;">1.0</span>
            <input id="set-node-scale" type="range" min="0.6" max="2.2" step="0.1" value="1" style="width:100%;margin-top:3px;accent-color:#7c3aed;">
          </label>
          <label style="font-size:11px;color:var(--giftgraph-muted);">
            Толщина линий <span id="val-edge-scale" style="float:right;">1.0</span>
            <input id="set-edge-scale" type="range" min="0.6" max="2.2" step="0.1" value="1" style="width:100%;margin-top:3px;accent-color:#7c3aed;">
          </label>
          <label style="font-size:11px;color:var(--giftgraph-muted);">
            Расстояние <span id="val-spring" style="float:right;">350</span>
            <input id="set-spring" type="range" min="100" max="600" step="10" value="350" style="width:100%;margin-top:3px;accent-color:#7c3aed;">
          </label>
          <label style="font-size:11px;color:var(--giftgraph-muted);">
            Расталкивание <span id="val-repulsion" style="float:right;">-350</span>
            <input id="set-repulsion" type="range" min="-600" max="-50" step="10" value="-350" style="width:100%;margin-top:3px;accent-color:#7c3aed;">
          </label>
          <button id="btn-apply-settings" class="giftgraph-button" type="button" style="width:100%;">Применить</button>
          <button id="btn-reshuffle" class="giftgraph-button" type="button" style="width:100%;">🔀 Перемешать</button>
        </div>
      </div>
      <button id="btn-toggle-settings" class="giftgraph-button" type="button">⚙</button>
    `;

    shell.appendChild(panel);

    document.getElementById('btn-toggle-settings').addEventListener('click', () => {
      const box = document.getElementById('giftgraph-settings-box');
      box.style.display = box.style.display === 'none' ? 'block' : 'none';
    });

    ['set-node-scale','set-edge-scale','set-spring','set-repulsion'].forEach(id => {
      const el = document.getElementById(id);
      if (!el) return;
      const valId = 'val-' + id.replace('set-', '');
      el.addEventListener('input', () => {
        const disp = document.getElementById(valId);
        if (disp) disp.textContent = el.value;
      });
    });

    document.getElementById('btn-apply-settings').addEventListener('click', applySettings);
    document.getElementById('btn-reshuffle').addEventListener('click', reshuffleGraph);
  }

  function applySettings() {
    const net = getNetwork();
    if (!net || !net.body || !net.body.data) return;
    const nodeScale = parseFloat(document.getElementById('set-node-scale').value || 1);
    const edgeScale = parseFloat(document.getElementById('set-edge-scale').value || 1);
    const springLen  = parseInt(document.getElementById('set-spring').value || 350);
    const repulsion  = parseInt(document.getElementById('set-repulsion').value || -350);

    clearHoverState();

    net.setOptions({
      physics: {
        enabled: true,
        solver: 'forceAtlas2Based',
        forceAtlas2Based: {
          gravitationalConstant: repulsion,
          centralGravity: 0.005,
          springLength: springLen,
          springConstant: 0.04,
          damping: 0.45,
          avoidOverlap: 1.0,
        },
        stabilization: { iterations: 250, fit: true },
      },
    });

    const nodes = net.body.data.nodes;
    const edges = net.body.data.edges;
    for (let i = 0; i < nodes.length; i++) {
      const baseSize = (META.nodes[nodes[i].id] || {}).size || 18;
      const baseFont = (META.nodes[nodes[i].id] || {}).kind === 'start' ? 16 : 13;
      nodes.update({ id: nodes[i].id, size: baseSize * nodeScale, font: { size: Math.round(baseFont * nodeScale) } });
    }
    for (let i = 0; i < edges.length; i++) {
      const baseW = (META.edges[i] || {}).width || 2;
      edges.update({ id: edges[i].id, width: baseW * edgeScale });
    }
    net.stabilize(200);
  }

  function reshuffleGraph() {
    clearHoverState();
    const net = getNetwork();
    if (!net) return;
    const nodeScale = parseFloat(document.getElementById('set-node-scale').value || 1);
    const edgeScale = parseFloat(document.getElementById('set-edge-scale').value || 1);
    const springLen  = parseInt(document.getElementById('set-spring').value || 350);
    const repulsion  = parseInt(document.getElementById('set-repulsion').value || -350);

    net.setOptions({
      physics: {
        enabled: true,
        solver: 'forceAtlas2Based',
        forceAtlas2Based: {
          gravitationalConstant: repulsion,
          centralGravity: 0.005,
          springLength: springLen,
          springConstant: 0.04,
          damping: 0.45,
          avoidOverlap: 1.0,
        },
        stabilization: { iterations: 250, fit: true },
      },
    });

    const nodes = net.body.data.nodes;
    const edges = net.body.data.edges;
    for (let i = 0; i < nodes.length; i++) {
      const baseSize = (META.nodes[nodes[i].id] || {}).size || 18;
      const baseFont = (META.nodes[nodes[i].id] || {}).kind === 'start' ? 16 : 13;
      nodes.update({ id: nodes[i].id, size: baseSize * nodeScale, font: { size: Math.round(baseFont * nodeScale) } });
    }
    for (let i = 0; i < edges.length; i++) {
      const baseW = (META.edges[i] || {}).width || 2;
      edges.update({ id: edges[i].id, width: baseW * edgeScale });
    }
    net.stabilize(250);
  }

  // ── Hover ──────────────────────────────────────────────────────────────

  function initHover() {
    const net = getNetwork();
    if (!net || !net.on) return;

    net.on('hoverNode', function(p) {
      const d = net.body.data.nodes.get(p.node);
      if (!d) return;
      hoverSaved[p.node] = {
        id: p.node,
        size: d.size,
        font: Object.assign({}, d.font),
        borderWidth: d.borderWidth || 2,
        shadow: d.shadow || { enabled: false },
      };
      const z = 2.0;
      net.body.data.nodes.update({
        id: p.node,
        size: d.size * z,
        font: { size: Math.round((d.font.size || 12) * z), color: d.font.color, bold: d.font.bold },
        borderWidth: 5,
        shadow: { enabled: true, color: 'rgba(168,85,247,0.85)', size: 32 },
      });
    });

    net.on('blurNode', function(p) {
      const s = hoverSaved[p.node];
      if (!s) return;
      net.body.data.nodes.update({
        id: p.node,
        size: s.size,
        font: s.font,
        borderWidth: s.borderWidth,
        shadow: { enabled: s.shadow.enabled || false },
      });
      delete hoverSaved[p.node];
    });
  }

  // ── Post-process layout ────────────────────────────────────────────────

  function postProcessLayout() {
    const net = getNetwork();
    if (!net || !net.body || !net.body.data) return;
    const positions = net.getPositions();
    let moved = false;

    Object.entries(META.nodes).forEach(([id, info]) => {
      if (!info.leaf || id === (META.summary && META.summary.start)) return;
      let parentIds = [];
      try { parentIds = JSON.parse(info.parents || '[]'); } catch (e) {}
      if (parentIds.length === 0) return;

      let sumX = 0, sumY = 0;
      parentIds.forEach(pid => {
        const pos = positions[pid];
        if (pos) { sumX += pos.x; sumY += pos.y; }
      });
      if (parentIds.length === 0) return;

      const centerX = sumX / parentIds.length;
      const centerY = sumY / parentIds.length;
      const pos = positions[id];
      if (pos) {
        const dx = centerX - pos.x;
        const dy = centerY - pos.y;
        pos.x += dx * 0.75;
        pos.y += dy * 0.75;
        moved = true;
      }
    });

    if (moved) {
      net.setPositions(positions);
      net.fit();
    }
  }

  // ── Init ───────────────────────────────────────────────────────────────

  buildSettingsPanel();
  bindToggle();
  initParallax();
  initHover();
  applyTheme(currentTheme());
  setTimeout(() => { postProcessLayout(); }, 2500);
})();
</script>
